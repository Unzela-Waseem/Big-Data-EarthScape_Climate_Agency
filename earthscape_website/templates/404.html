{% extends "base.html" %}
{% block title %}Page Not Found — EarthScape{% endblock %}

    <div class="col-md-6 text-center">
        <div class="card card-es p-5 shadow-sm">
            <div class="display-1 text-secondary mb-3"><i class="bi bi-compass"></i></div>
            <h2 class="fw-bold mb-3" style="font-family:'Fraunces', serif;">404 — Page Not Found</h2>

                <a href="{{ url_for('dashboard') }}" class="btn btn-forest px-4 py-2">Return to Dashboard</a>

        </div>
    </div>
</div>
{% endblock %}
